[project]
name = "agent-server"
version = "0.1.0"
description = "Stateless LangGraph agent with web search and code execution"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-langchain>=0.20.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.0",
    "langgraph>=1.1.0",
    "langchain-mcp-adapters>=0.2.1",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
default-groups = ["dev", "setup"]

# Pin databricks-ai-bridge/langchain/openai to the 0.20.0 release commit
# (databricks-ai-bridge 0.20.0 / databricks-langchain 0.20.0 / databricks-openai 0.16.0).
# The Databricks PyPI proxy used by Databricks Apps hasn't mirrored 0.20.0
# from public PyPI yet. Drop this block once the proxy syncs.
[tool.uv.sources]
databricks-ai-bridge = { git = "https://github.com/databricks/databricks-ai-bridge.git", rev = "827ae73782c0422e17baf6d4f8ec16901d32418a" }
databricks-langchain = { git = "https://github.com/databricks/databricks-ai-bridge.git", rev = "827ae73782c0422e17baf6d4f8ec16901d32418a", subdirectory = "integrations/langchain" }
databricks-openai = { git = "https://github.com/databricks/databricks-ai-bridge.git", rev = "827ae73782c0422e17baf6d4f8ec16901d32418a", subdirectory = "integrations/openai" }

[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
discover-tools = "scripts.discover_tools:main"
preflight = "scripts.preflight:main"
